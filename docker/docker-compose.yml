version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: portfolio-tracker-db
    environment:
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: portfolio_password
      POSTGRES_DB: portfolio_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - portfolio-network

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile
    container_name: portfolio-tracker-backend
    environment:
      - DATABASE_URL=postgresql://portfolio_user:portfolio_password@postgres:5432/portfolio_tracker
      - JWT_SECRET=your-super-secret-jwt-key-here
      - ALPHA_VANTAGE_API_KEY=your-alpha-vantage-api-key
      - NODE_ENV=production
      - PORT=3001
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    networks:
      - portfolio-network
    volumes:
      - ../backend:/app
      - /app/node_modules

  # Frontend (Next.js)
  frontend:
    image: node:18-alpine
    container_name: portfolio-tracker-frontend
    working_dir: /app
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
    networks:
      - portfolio-network

  # Redis (for caching)
  redis:
    image: redis:7-alpine
    container_name: portfolio-tracker-redis
    ports:
      - "6379:6379"
    networks:
      - portfolio-network

volumes:
  postgres_data:

networks:
  portfolio-network:
    driver: bridge
